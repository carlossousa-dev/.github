<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Primary Accent Gradient (Cyan to Electric Blue) -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Secondary Accent Gradient (Indigo to Purple) -->
    <linearGradient id="indigoPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientBg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="160" cy="160" r="120" fill="#0284C7" opacity="0.18" filter="url(#ambientBg)"/>
  <circle cx="360" cy="360" r="140" fill="#7C3AED" opacity="0.18" filter="url(#ambientBg)"/>

  <!-- Precision Border Stroke -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Sleek Grid Accent Lines -->
  <path d="M 80 256 L 432 256 M 256 80 L 256 432" stroke="#334155" stroke-width="1" stroke-dasharray="6 8" stroke-opacity="0.25"/>

  <!-- Monogram Mark "CS" / Code Bracket Fusion -->
  <g transform="translate(0, 0)">
    <!-- Shadow for Depth -->
    <g opacity="0.4" filter="url(#glow)">
      <!-- Outer C-Bracket -->
      <path d="M 230 148 L 166 190 C 138 208 122 232 122 264 C 122 296 138 320 166 338 L 230 380" 
            fill="none" stroke="#0284C7" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Inner S-Stream -->
      <path d="M 334 176 C 290 156 244 192 244 226 C 244 266 352 254 352 306 C 352 350 286 376 250 354" 
            fill="none" stroke="#7C3AED" stroke-width="28" stroke-linecap="round"/>
    </g>

    <!-- Foreground Outer "C" / Opening Terminal Angle -->
    <path d="M 236 142 L 172 184 C 142 204 126 230 126 264 C 126 298 142 324 172 344 L 236 386" 
          fill="none" stroke="url(#cyanBlueGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Foreground Connected "S" Flow -->
    <path d="M 342 168 C 298 144 250 184 250 224 C 250 268 358 254 358 310 C 358 354 296 380 256 356" 
          fill="none" stroke="url(#indigoPurpleGrad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Dynamic Code Node / Core Spark -->
    <circle cx="368" cy="202" r="10" fill="#38BDF8">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="198" cy="386" r="6" fill="#A855F7"/>
  </g>
</svg>
