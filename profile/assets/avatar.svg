<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Enterprise Dark Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="60%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Titanium Steel Gradients -->
    <linearGradient id="titaniumLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="titaniumMuted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Emerald Operational Pulse -->
    <linearGradient id="emeraldPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Precision Drop Shadow -->
    <filter id="crispShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGradient)"/>
  
  <!-- Subtle Architectural Grid Background -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1.5">
    <line x1="20" y1="128" x2="492" y2="128" stroke-dasharray="4 6"/>
    <line x1="20" y1="256" x2="492" y2="256" stroke-dasharray="4 6"/>
    <line x1="20" y1="384" x2="492" y2="384" stroke-dasharray="4 6"/>
    <line x1="128" y1="20" x2="128" y2="492" stroke-dasharray="4 6"/>
    <line x1="256" y1="20" x2="256" y2="492" stroke-dasharray="4 6"/>
    <line x1="384" y1="20" x2="384" y2="492" stroke-dasharray="4 6"/>
  </g>

  <!-- Precision Chamfer Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#glassBorder)" stroke-width="2.5"/>

  <!-- Inner Architectural Shield -->
  <g filter="url(#crispShadow)">
    
    <!-- LEFT BRACKET: < (Precision Monospace Geometry) -->
    <path d="M 172 178 L 96 256 L 172 334" 
          fill="none" 
          stroke="url(#cyanLaser)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#laserGlow)"/>

    <!-- RIGHT CLOSING BRACKET: /> -->
    <g transform="translate(0, 0)">
      <!-- Slash / -->
      <line x1="324" y1="184" x2="284" y2="328" 
            stroke="url(#titaniumMuted)" 
            stroke-width="16" 
            stroke-linecap="round"/>

      <!-- Right Chevron > -->
      <path d="M 340 178 L 416 256 L 340 334" 
            fill="none" 
            stroke="url(#cyanLaser)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#laserGlow)"/>
    </g>

    <!-- CENTER MONOGRAM: CS (Architectural Solid Titanium) -->
    <!-- "C" Letterform -->
    <path d="M 248 206 C 240 198 228 194 212 194 C 182 194 162 216 162 256 C 162 296 182 318 212 318 C 228 318 240 314 248 306" 
          fill="none" 
          stroke="url(#titaniumLight)" 
          stroke-width="20" 
          stroke-linecap="round"/>

    <!-- "S" Letterform -->
    <path d="M 282 210 C 272 198 258 194 242 194 C 228 194 218 202 218 216 C 218 244 286 242 286 280 C 286 308 266 318 242 318 C 226 318 212 312 202 300" 
          fill="none" 
          stroke="url(#titaniumLight)" 
          stroke-width="20" 
          stroke-linecap="round"/>
  </g>

  <!-- Green Neon Operational Indicator Dot (From carlossousa.dev) -->
  <circle cx="256" cy="382" r="6" fill="url(#emeraldPulse)"/>
  <circle cx="256" cy="382" r="14" fill="#10B981" opacity="0.25"/>
</svg>
